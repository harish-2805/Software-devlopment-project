{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student Portal{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'student/dashboard.css' %}">
    <!-- Chart.js for interactive graphs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

<div class="topbar">
    <div class="topbar-left">
        <span class="topbar-logo">🎓</span>
        <span class="topbar-title">Academic Portal</span>
    </div>
    <div class="topbar-right">
        <span class="topbar-user">👤 {{ request.user.username }}</span>
        <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
    </div>
</div>

<div class="layout">

    <div class="sidebar">
        <div class="sidebar-profile">
            <div class="avatar">{{ request.user.username|first|upper }}</div>
            <div class="sidebar-name">{{ request.user.username }}</div>
            <div class="sidebar-role">Student</div>
        </div>
            <nav class="sidebar-nav">
            <a href="{% url 'student_dashboard' %}"  class="nav-item {% block nav_dashboard %}{% endblock %}">
                <span class="nav-icon">🏠</span> Dashboard
            </a>
            <a href="{% url 'student_academics' %}"  class="nav-item {% block nav_academics %}{% endblock %}">
                <span class="nav-icon">📚</span> Academics
            </a>
            <a href="{% url 'student_attendance' %}" class="nav-item {% block nav_attendance %}{% endblock %}">
                <span class="nav-icon">📋</span> Attendance
            </a>
            <a href="{% url 'student_messages' %}"   class="nav-item {% block nav_messages %}{% endblock %}">
                <span class="nav-icon">✉️</span> Messages
            </a>
            <a href="{% url 'student_alumni' %}"     class="nav-item {% block nav_alumni %}{% endblock %}">
                <span class="nav-icon">🎓</span> Alumni
            </a>
        </nav>
    </div>

    <div class="main-content">
        {% block content %}
        {% endblock %}
    </div>

</div>

</body>
</html>
